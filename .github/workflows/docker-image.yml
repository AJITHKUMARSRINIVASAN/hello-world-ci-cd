name: Docker Image CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || 'ajithkumar1828' }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN || secrets.DOCKER_TOKEN || secrets.DOCKER_ACCESS_TOKEN }}
      IMAGE_NAME: hello-world

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Check Docker Hub secrets
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "::error::Missing Docker Hub username. Add DOCKER_USERNAME as a repository secret, or keep the hardcoded username in this workflow."
            exit 1
          fi

          if [ -z "$DOCKER_PASSWORD" ]; then
            echo "::error::Missing Docker Hub token. Add one of these repository secrets in AJITHKUMARSRINIVASAN/hello-world-ci-cd: DOCKER_PASSWORD, DOCKERHUB_TOKEN, DOCKER_TOKEN, or DOCKER_ACCESS_TOKEN."
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t "$DOCKER_USERNAME/$IMAGE_NAME:latest" .

      - name: Test Docker Image
        run: |
          docker run --rm "$DOCKER_USERNAME/$IMAGE_NAME:latest"

      - name: Push Docker Image
        run: |
          docker push "$DOCKER_USERNAME/$IMAGE_NAME:latest"
