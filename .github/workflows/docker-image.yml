name: Docker Image CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ajithkumar1828
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGE_NAME: hello-world

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Check Docker Hub secrets
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Missing Docker Hub token. Add a repository secret named DOCKERHUB_TOKEN in AJITHKUMARSRINIVASAN/hello-world-ci-cd."
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t "$DOCKER_USERNAME/$IMAGE_NAME:latest" .

      - name: Test Docker Image
        run: |
          docker run --rm "$DOCKER_USERNAME/$IMAGE_NAME:latest"

      - name: Push Docker Image
        run: |
          docker push "$DOCKER_USERNAME/$IMAGE_NAME:latest"
